<style>
    .link{
    display:flex;
    align-items:center;
    gap:15px;

    text-decoration:none;
    color:#000;

    background:rgba(255,255,255,.55);
    backdrop-filter:blur(20px);

    border-radius:50px;

    padding:15px 20px;

    transition:.4s;

    box-shadow:
    0 8px 20px rgba(255,105,180,.2);
}

.link:hover{
    transform:scale(1.03);
}

.foto-link{
    width: 60px;
    height: 60px;
    min-width: 60px; /* impede que a imagem seja achatada */
    border-radius: 50%;
    object-fit: cover;
}

.texto-link{
    text-align:left;
}

.texto-link h3{
    font-size:20px;
    color:#222;
}

.texto-link p{
    color:gray;
    font-size:15px;

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#ffd6e7,#ffc9dd,#ffeaf3);
}

/* Corações flutuando */

.coracao{
    position:absolute;
    color:white;
    font-size:55px;
    animation:subir linear infinite;
    opacity:.6;
}

.coracao:nth-child(1){
    left:10%;
    animation-duration:9s;
}
.coracao:nth-child(2){
    left:30%;
    animation-duration:12s;
}
.coracao:nth-child(3){
    left:50%;
    animation-duration:8s;
}
.coracao:nth-child(4){
    left:70%;
    animation-duration:11s;
}
.coracao:nth-child(5){
    left:90%;
    animation-duration:10s;
}

@keyframes subir{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-100px);
    }
}

/* Card principal */

.container{

    width:90%;
    max-width:420px;
    padding:35px;

    background:rgba(255,255,255,.22);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.4);

    box-shadow:
    0 8px 32px rgba(255,105,180,.25);

    border-radius:35px;

    text-align:center;
}

/* Foto */

.foto{

    width:140px;
    height:140px;

    border-radius:50%;

    object-fit:cover;

    border:5px solid rgba(255,255,255,.8);

    box-shadow:
    0 0 25px #ff77ac,
    0 0 45px #ffb3ce;

}

/* Título */

h1{
    margin-top:20px;
    color:#ff4f93;
    font-size:34px;
}

/* Descrição */

.descricao{
    margin-top:12px;
    color:#7a5362;
    line-height:28px;
    font-size:17px;
}

/* Botões */

.links{
    margin-top:35px;
    display:flex;
    flex-direction:column;
    gap:20px;
}

.link{

    text-decoration:none;

    color:#ff4f93;

    font-size:18px;
    font-weight:600;

    padding:18px;

    border-radius:20px;

    background:rgba(255,255,255,.25);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.4);

    transition:.4s;

    box-shadow:
    0 5px 20px rgba(255,105,180,.2);

}

.link:hover{

    transform:translateY(-5px) scale(1.03);

    background:rgba(255,255,255,.5);

    box-shadow:
    0 0 20px #ff8eb7,
    0 0 40px #ffc7dc;

}

footer{
    margin-top:35px;
    color:#9d6c81;
    font-size:14px;
}

.emoji{
    font-size:22px;
    margin-right:8px;
}

</style>
</head>
